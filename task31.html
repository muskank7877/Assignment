<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Menu Bar</title>
<style>
* { margin: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; }

.navbar {
  display: flex; /* main property */
  justify-content: space-between;
  align-items: center;
  background: #6c5ce7;
  padding: 15px 30px;
  color: white;
}

.logo { font-size: 22px; font-weight: bold; }

.menu {
  display: flex;
  gap: 25px;
  list-style: none;
}

.menu li a {
  color: white;
  text-decoration: none;
  font-size: 16px;
}

.menu li a:hover { text-decoration: underline; }

/* Responsive - mobile pe column ho jayega */
@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    align-items: flex-start;
  }
  .menu {
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
    width: 100%;
  }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">MySite</div>
  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<div style="padding:30px;">
  <h2>Flex Menu Bar Working</h2>
  <p>Desktop pe ek line me, mobile pe automatic column ban jayega.</p>
</div>

</body>
</html>
