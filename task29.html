<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Section</title>
<style>
* { margin: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; }

.hero {
  position: relative; /* parent relative */
  height: 100vh;
  background: url('https://picsum.photos/1200/800') no-repeat center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Kala overlay piche rakhne ke liye */
.hero::before {
  content: "";
  position: absolute; /* absolute */
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 1; /* piche */
}

/* Content upar rakhne ke liye */
.hero-content {
  position: relative;
  z-index: 2; /* upar */
  color: white;
  text-align: center;
  padding: 20px;
}

.hero-content h1 { font-size: 50px; margin-bottom: 15px; }
.hero-content p { font-size: 18px; margin-bottom: 20px; }

.hero-content button {
  padding: 12px 30px;
  border: none;
  border-radius: 25px;
  background: #6c5ce7;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* Ek design element jo sabse upar hoga */
.badge {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #ffeaa7;
  color: #000;
  padding: 8px 15px;
  border-radius: 20px;
  z-index: 3; /* sabse upar */
  font-weight: bold;
}
</style>
</head>
<body>

<section class="hero">
  <div class="badge">New Launch</div>
  
  <div class="hero-content">
    <h1>Build Something Amazing</h1>
    <p>We use position and z-index to layer content perfectly.</p>
    <button>Get Started</button>
  </div>
</section>

</body>
</html>
