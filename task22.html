
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>
        /* 1. Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* 2. Element Selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 20px;
            color: #333;
        }

        /* 3. Class Selector */
        .highlight {
            background-color: lightblue;
            padding: 15px;
            border-radius: 8px;
        }

        /* 4. ID Selector */
        #main-heading {
            color: darkblue;
            text-align: center;
        }

        /* Element Selector */
        p {
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1 id="main-heading">My Student Page</h1>

    <div class="highlight">
        <h2>About Me</h2>
        <p>My name is Muskan. I am a BCA AI student.</p>
        <p>I am learning HTML and CSS.</p>
    </div>

    <h2>My Goal</h2>
    <p>My goal is to become a skilled software developer.</p>

</body>
</html>
