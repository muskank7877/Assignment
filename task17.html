
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill in your details below.</p>

    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="website">Portfolio Website:</label>
            <input type="url" id="website" name="website">
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Position:</label>
            <select id="position" name="position">
                <option value="web-developer">Web Developer</option>
                <option value="software-developer">Software Developer</option>
                <option value="ai-engineer">AI Engineer</option>
            </select>
            <br><br>

            <p>Employment Type:</p>
            <input type="radio" id="fulltime" name="employment" value="Full-time">
            <label for="fulltime">Full-time</label>

            <input type="radio" id="parttime" name="employment" value="Part-time">
            <label for="parttime">Part-time</label>
            <br><br>

            <p>Skills:</p>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label>

            <input type="checkbox" id="communication" name="skills" value="Communication">
            <label for="communication">Communication</label>
            <br><br>

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
            <br><br>

            <label for="salary">Expected Salary:</label>
            <input type="range" id="salary" name="salary" min="10000" max="100000" step="5000">
            <br><br>

            <label for="interviewtime">Preferred Interview Time:</label>
            <input type="time" id="interviewtime" name="interviewtime">
            <br><br>

            <label for="availablemonth">Available From:</label>
            <input type="month" id="availablemonth" name="availablemonth">
            <br><br>

            <label for="interviewweek">Preferred Interview Week:</label>
            <input type="week" id="interviewweek" name="interviewweek">
            <br><br>

            <label for="favcolor">Choose a Profile Theme Color:</label>
            <input type="color" id="favcolor" name="favcolor">
            <br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume">
            <br><br>

            <label for="coverletter">Cover Letter:</label>
            <textarea id="coverletter" name="coverletter" rows="5" cols="35"></textarea>
            <br><br>
        </fieldset>

        <br>
        <input type="hidden" name="formtype" value="job-application">

        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">I confirm that my information is correct.</label>
        <br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Clear Form">
        <input type="button" value="Demo Button" onclick="alert('This is a demo button!')">
    </form>

</body>
</html>
