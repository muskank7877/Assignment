
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design Tokens</title>

    <style>
        /* Design Tokens */
        :root {
            --primary-color: #1d4ed8;
            --secondary-color: #0f766e;
            --background-color: #f1f5f9;
            --text-color: #334155;
            --card-color: #ffffff;

            --font-size-small: 14px;
            --font-size-base: 16px;
            --font-size-large: 24px;
            --font-size-heading: 32px;

            --spacing-small: 10px;
            --spacing-medium: 20px;
            --spacing-large: 30px;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: var(--font-size-base);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: var(--spacing-large);
        }

        header {
            text-align: center;
            background-color: var(--primary-color);
            color: var(--card-color);
            padding: var(--spacing-medium);
        }

        h1 {
            font-size: var(--font-size-heading);
        }

        h2 {
            color: var(--secondary-color);
            font-size: var(--font-size-large);
        }

        .card {
            background-color: var(--card-color);
            padding: var(--spacing-medium);
            margin-top: var(--spacing-medium);
            border-radius: 8px;
        }

        .small-text {
            font-size: var(--font-size-small);
        }
    </style>
</head>
<body>

    <header>
        <h1>My Student Page</h1>
        <p>Learning CSS Design Tokens</p>
    </header>

    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>My name is Muskan. I am a BCA AI student.</p>
            <p class="small-text">I am learning HTML and CSS.</p>
        </section>

        <section class="card">
            <h2>My Goal</h2>
            <p>My goal is to become a skilled software developer.</p>
        </section>
    </main>

</body>
</html>
